name: MEZO ROM Build — Snapdragon

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'ROM download URL'
        required: true
      style:
        description: 'DeadZone ROM Style'
        required: true
        default: 'Plus'
        type: choice
        options:
          - Lite
          - Plus
          - Legend
          - Ninja
      notify_telegram:
        description: 'Live Telegram notifications'
        type: boolean
        default: false
      upload_pixeldrain:
        description: 'Upload final ZIP to PixelDrain'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TG_SOC: snapdragon
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_SNAPDRAGON_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_SNAPDRAGON_CHAT_ID }}
      PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}

    steps:
      - name: Clean runner
        run: |
          docker rmi $(docker images -q) || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php || true
          sudo apt -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell mysql* php* || true
          sudo apt -y autoremove --purge || true
          sudo apt clean || true

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Set timezone
        run: sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install dependencies
        run: |
          sudo bash setup.sh
          sudo apt-get install -y unrar p7zip-full 2>/dev/null || true

      - name: Set permissions
        run: sudo chmod 777 -R *

      # ── Resolve DeadZone Style ────────────────────────────────────────────
      - name: Resolve DeadZone Style
        run: |
          RAW_STYLE="${{ inputs.style }}"
          case "${RAW_STYLE,,}" in
            lite)                STYLE_ID=lite   ; STYLE_NAME="DeadZone Lite"   ; STYLE_TIER=Free  ;;
            plus|stable|free)    STYLE_ID=plus   ; STYLE_NAME="DeadZone Plus"   ; STYLE_TIER=Free  ;;
            legend|paid)         STYLE_ID=legend ; STYLE_NAME="DeadZone Legend" ; STYLE_TIER=Paid  ;;
            ninja)               STYLE_ID=ninja  ; STYLE_NAME="DeadZone Ninja"  ; STYLE_TIER=Paid  ;;
            *)
              echo "::error::Unsupported DeadZone style: ${RAW_STYLE}"
              exit 1
              ;;
          esac
          echo "DZ_STYLE=${RAW_STYLE}"        >> "$GITHUB_ENV"
          echo "DZ_STYLE_ID=${STYLE_ID}"      >> "$GITHUB_ENV"
          echo "DZ_STYLE_NAME=${STYLE_NAME}"  >> "$GITHUB_ENV"
          echo "DZ_STYLE_TIER=${STYLE_TIER}"  >> "$GITHUB_ENV"
          echo "[STYLE] ${RAW_STYLE} → ${STYLE_ID} (${STYLE_NAME}, ${STYLE_TIER})"

      # ── Telegram: build started ───────────────────────────────────────────
      - name: Telegram - Started
        if: ${{ inputs.notify_telegram }}
        run: sudo -E python3 bin/scripts/telegram.py start snapdragon

      # ── Build ROM (with live log watcher) ─────────────────────────────────
      - name: Build ROM
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          set +eo pipefail

          LOG=/tmp/mezo_build.log
          : > "$LOG"

          if [ "${{ inputs.notify_telegram }}" = "true" ]; then
            rm -f /tmp/tg_watch_stop
            sudo -E python3 bin/scripts/tg_watch.py "$LOG" unpack &
            TG_PID=$!
          fi

          sudo bash build.sh "$INPUT_URL" 2>&1 | tee "$LOG"
          STEP_EXIT=${PIPESTATUS[0]}

          if [ "${{ inputs.notify_telegram }}" = "true" ]; then
            touch /tmp/tg_watch_stop
            sleep 3
            sudo kill "$TG_PID" 2>/dev/null || true
          fi

          set -eo pipefail
          exit $STEP_EXIT

      - name: Telegram - Build Done
        if: ${{ inputs.notify_telegram && success() }}
        run: |
          sudo -E python3 bin/scripts/telegram.py update unpack OK
          sudo -E python3 bin/scripts/telegram.py update mods OK

      # ── Pack ROM (with live log watcher) ──────────────────────────────────
      - name: Pack ROM
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          set +eo pipefail

          LOG=/tmp/mezo_pack.log
          : > "$LOG"

          if [ "${{ inputs.notify_telegram }}" = "true" ]; then
            rm -f /tmp/tg_watch_stop
            sudo -E python3 bin/scripts/tg_watch.py "$LOG" rebuild &
            TG_PID=$!
          fi

          sudo bash packROM.sh 2>&1 | tee "$LOG"
          STEP_EXIT=${PIPESTATUS[0]}

          if [ "${{ inputs.notify_telegram }}" = "true" ]; then
            touch /tmp/tg_watch_stop
            sleep 3
            sudo kill "$TG_PID" 2>/dev/null || true
          fi

          set -eo pipefail
          exit $STEP_EXIT

      - name: Telegram - Pack Done
        if: ${{ inputs.notify_telegram && success() }}
        run: |
          sudo -E python3 bin/scripts/telegram.py update rebuild OK
          sudo -E python3 bin/scripts/telegram.py update super OK
          sudo -E python3 bin/scripts/telegram.py update vbmeta OK

      # ── Package final ROM ZIP (DeadZone template) ────────────────────────
      - name: Package ROM ZIP
        run: |
          set +eo pipefail

          LOG=/tmp/mezo_package.log
          : > "$LOG"

          if [ "${{ inputs.notify_telegram }}" = "true" ]; then
            rm -f /tmp/tg_watch_stop
            sudo -E python3 bin/scripts/tg_watch.py "$LOG" zip &
            TG_PID=$!
          fi

          sudo -E python3 bin/scripts/package_rom.py 2>&1 | tee "$LOG"
          STEP_EXIT=${PIPESTATUS[0]}

          if [ "${{ inputs.notify_telegram }}" = "true" ]; then
            touch /tmp/tg_watch_stop
            sleep 2
            sudo kill "$TG_PID" 2>/dev/null || true
          fi

          echo "[PACKAGE] ZIP path: $(cat bin/output/reports/final_zip_path.txt)"
          set -eo pipefail
          exit $STEP_EXIT

      - name: Telegram - Package Done
        if: ${{ inputs.notify_telegram && success() }}
        run: sudo -E python3 bin/scripts/telegram.py update zip OK

      # ── PixelDrain upload (primary upload path) ───────────────────────────
      - name: Telegram - Upload Starting
        if: ${{ inputs.notify_telegram && inputs.upload_pixeldrain && success() }}
        run: sudo -E python3 bin/scripts/telegram.py update upload_pixeldrain RUN

      - name: PixelDrain Upload
        id: pixeldrain_upload
        if: ${{ inputs.upload_pixeldrain && success() }}
        run: |
          ZIP_PATH=$(cat bin/output/reports/final_zip_path.txt 2>/dev/null || echo "")
          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Cannot find final ZIP path in bin/output/reports/final_zip_path.txt"
            exit 1
          fi
          echo "[PIXELDRAIN] Uploading: $ZIP_PATH"
          sudo -E python3 bin/scripts/pixeldrain_upload.py "$ZIP_PATH"

      - name: Telegram - Upload Done
        if: ${{ inputs.notify_telegram && inputs.upload_pixeldrain && success() }}
        run: sudo -E python3 bin/scripts/telegram.py update upload_pixeldrain OK

      # ── Final Telegram status ──────────────────────────────────────────────
      - name: Telegram - Success
        if: ${{ inputs.notify_telegram && success() }}
        run: |
          PIXELDRAIN_URL=""
          REPORT="bin/output/reports/pixeldrain_upload_report.json"
          if [ -f "$REPORT" ]; then
            PIXELDRAIN_URL=$(python3 -c "import json; d=json.load(open('$REPORT')); print(d.get('url',''))" 2>/dev/null || echo "")
          fi

          ZIP_NAME=""
          ZIP_SIZE="0"
          ZIP_PATH=$(cat bin/output/reports/final_zip_path.txt 2>/dev/null || echo "")
          if [ -f "$ZIP_PATH" ]; then
            ZIP_NAME=$(basename "$ZIP_PATH")
            ZIP_SIZE=$(python3 -c "import os; print(f'{os.path.getsize(\"$ZIP_PATH\")/1024/1024:.1f}')" 2>/dev/null || echo "0")
          fi

          sudo -E python3 bin/scripts/telegram.py finish OK \
            --url "$PIXELDRAIN_URL" \
            --zip "${ZIP_NAME:-}" \
            --size "${ZIP_SIZE:-0}"

      # ── Create failure debug ZIP ──────────────────────────────────────────
      - name: Create failure debug ZIP
        if: failure()
        run: |
          mkdir -p bin/output/reports bin/output/logs
          sudo -E python3 bin/scripts/debug_zip.py || true

      - name: Telegram - Failed
        if: ${{ inputs.notify_telegram && failure() }}
        run: |
          FAILED_STAGE=""
          if [ "${{ steps.pixeldrain_upload.outcome }}" = "failure" ]; then
            FAILED_STAGE="upload_pixeldrain"
          fi

          ERROR_TEXT=""
          if [ -f bin/output/reports/package_error_report.txt ]; then
            ERROR_TEXT=$(grep -m1 "^Reason:" bin/output/reports/package_error_report.txt | sed 's/^Reason:[[:space:]]*//' | head -c 200 || true)
          fi
          if [ -z "$ERROR_TEXT" ] && [ -f /tmp/mezo_package.log ]; then
            ERROR_TEXT=$(grep -i "error\|failed\|invalid" /tmp/mezo_package.log | tail -n3 | tr '\n' ' ' | head -c 200 || true)
          fi
          if [ -z "$ERROR_TEXT" ] && [ -f /tmp/mezo_pack.log ]; then
            ERROR_TEXT=$(grep -i "error\|failed\|invalid" /tmp/mezo_pack.log | tail -n3 | tr '\n' ' ' | head -c 200 || true)
          fi
          if [ -z "$ERROR_TEXT" ] && [ -f /tmp/mezo_build.log ]; then
            ERROR_TEXT=$(grep -i "error\|failed\|invalid" /tmp/mezo_build.log | tail -n3 | tr '\n' ' ' | head -c 200 || true)
          fi

          DEBUG_ZIP_NAME=""
          if [ -f bin/output/reports/build_failure_debug.zip ]; then
            DEBUG_ZIP_NAME="build_failure_debug.zip (artifact: deadzone-failure-debug)"
          fi

          sudo -E python3 bin/scripts/telegram.py finish FAIL \
            ${FAILED_STAGE:+--failed-stage "$FAILED_STAGE"} \
            ${ERROR_TEXT:+--error "$ERROR_TEXT"} \
            ${DEBUG_ZIP_NAME:+--debug-zip "$DEBUG_ZIP_NAME"}

      # ── Upload failure debug artifact ─────────────────────────────────────
      - name: Upload failure debug artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deadzone-failure-debug
          path: bin/output/reports/build_failure_debug.zip
          if-no-files-found: warn
          retention-days: 7

      # ── Cleanup ───────────────────────────────────────────────────────────
      - name: Cleanup workspace
        if: always()
        run: |
          sudo rm -rf "${{ github.workspace }}/out"   || true
          sudo rm -rf "${{ github.workspace }}/build" || true
          rm -f /tmp/tg_watch_stop /tmp/mezo_build.log /tmp/mezo_pack.log /tmp/mezo_package.log || true
