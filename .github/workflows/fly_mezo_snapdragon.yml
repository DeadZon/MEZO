name: MEZO Fly Snapdragon

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'ROM download URL'
        required: true
        type: string
      server_id:
        description: 'Fly server ID (1 or 2)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
      style:
        description: 'DeadZone ROM Style'
        required: true
        default: 'Plus'
        type: choice
        options:
          - Lite
          - Plus
          - Legend
          - Ninja
      mode:
        description: 'Build mode'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - production
      upload_pixeldrain:
        description: 'Upload final ZIP to PixelDrain'
        type: boolean
        default: false
      notify_telegram:
        description: 'Send Telegram notifications'
        type: boolean
        default: true
      allow_oversized_final:
        description: 'Allow final ZIP over 4.5 GB'
        type: boolean
        default: false
      VM_CPUS:
        description: 'Fly.io VM CPUs'
        required: true
        default: '8'
      VM_MEMORY:
        description: 'Fly.io VM Memory in MB'
        required: true
        default: '65536'

jobs:
  fly_build:
    name: Launch Snapdragon build on Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SNAPDRAGON_API_TOKEN }}

      - name: Log build configuration
        run: |
          if [ "${{ inputs.server_id }}" = "2" ]; then
            FLY_APP="mezo-snapdragon-builder-2"
            FLY_VOLUME="mezo_snapdragon_data_2"
          else
            FLY_APP="mezo-snapdragon-builder-1"
            FLY_VOLUME="mezo_snapdragon_data"
          fi
          echo "============================================"
          echo "  MEZO Fly Snapdragon Build"
          echo "  App       : ${FLY_APP}"
          echo "  Region    : fra"
          echo "  Volume    : ${FLY_VOLUME}"
          echo "  Server ID : ${{ inputs.server_id }}"
          echo "  VM CPUs   : ${{ inputs.VM_CPUS }}"
          echo "  VM Memory : ${{ inputs.VM_MEMORY }} MB"
          echo "  Style     : ${{ inputs.style }}"
          echo "  Mode      : ${{ inputs.mode }}"
          echo "  PixelDrain: ${{ inputs.upload_pixeldrain }}"
          echo "  Telegram  : ${{ inputs.notify_telegram }}"
          echo "  Oversized : ${{ inputs.allow_oversized_final }}"
          echo "  Run URL   : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "============================================"

      - name: Build Docker image and launch Fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SNAPDRAGON_API_TOKEN }}
        run: |
          # Select app, volume, and API token based on server_id
          if [ "${{ inputs.server_id }}" = "2" ]; then
            FLY_APP="mezo-snapdragon-builder-2"
            FLY_VOLUME="mezo_snapdragon_data_2"
            export FLY_API_TOKEN="${{ secrets.FLY_SNAPDRAGON_API_TOKEN_2 }}"
          else
            FLY_APP="mezo-snapdragon-builder-1"
            FLY_VOLUME="mezo_snapdragon_data"
            export FLY_API_TOKEN="${{ secrets.FLY_SNAPDRAGON_API_TOKEN }}"
          fi

          flyctl machine run . \
            --app "$FLY_APP" \
            --region fra \
            --vm-cpu-kind performance \
            --vm-cpus "${{ inputs.VM_CPUS }}" \
            --vm-memory "${{ inputs.VM_MEMORY }}" \
            --volume "${FLY_VOLUME}:/mnt/mezo_data" \
            --env SOC=snapdragon \
            --env TG_SOC=snapdragon \
            --env "ROM_URL=${{ inputs.rom_url }}" \
            --env "STYLE=${{ inputs.style }}" \
            --env "MODE=${{ inputs.mode }}" \
            --env "UPLOAD_PIXELDRAIN=${{ inputs.upload_pixeldrain }}" \
            --env "NOTIFY_TELEGRAM=${{ inputs.notify_telegram }}" \
            --env "ALLOW_OVERSIZED_FINAL=${{ inputs.allow_oversized_final }}" \
            --env "PIXELDRAIN_API_KEY=${{ secrets.PIXELDRAIN_API_KEY }}" \
            --env "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_SNAPDRAGON_BOT_TOKEN }}" \
            --env "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_SNAPDRAGON_CHAT_ID }}" \
            --env "TELEGRAM_SNAPDRAGON_BOT_TOKEN=${{ secrets.TELEGRAM_SNAPDRAGON_BOT_TOKEN }}" \
            --env "TELEGRAM_SNAPDRAGON_CHAT_ID=${{ secrets.TELEGRAM_SNAPDRAGON_CHAT_ID }}" \
            --env "GITHUB_REPOSITORY=${{ github.repository }}" \
            --env "GITHUB_RUN_ID=${{ github.run_id }}" \
            --env "GITHUB_RUN_NUMBER=${{ github.run_number }}" \
            --env "GITHUB_ACTOR=${{ github.actor }}" \
            --env "GITHUB_REF_NAME=${{ github.ref_name }}" \
            --env "GITHUB_SHA=${{ github.sha }}" \
            --env "GITHUB_SERVER_URL=${{ github.server_url }}" \
            --env "GITHUB_WORKFLOW=MEZO Fly Snapdragon" \
            --env "MEZO_BACKEND=Fly.io" \
            --env "SERVER_ID=${{ inputs.server_id }}" \
            --rm
