name: DeadZone Auto Stable Builder

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Builder mode'
        required: true
        default: 'scan_only'
        type: choice
        options:
          - scan_only
          - build_next
          - scan_and_build
      auto_publish:
        description: 'Publish to Telegram after successful build'
        type: boolean
        default: true
      max_builds:
        description: 'Maximum ROMs to build per run'
        default: '1'
      scan_pages:
        description: 'Number of TECH_MUKUL pages to scan (default 5)'
        default: '5'
      reset_queue:
        description: 'Clear the queue before scanning (removes all pending items)'
        type: boolean
        default: false
      stop_on_first_failure:
        description: 'Stop the build loop after the first build or upload failure'
        type: boolean
        default: false

  schedule:
    # Auto scan every 6 hours — does not build, only updates queue
    - cron: '0 */6 * * *'

concurrency:
  group: deadzone-auto-stable-builder
  cancel-in-progress: false

jobs:
  auto_stable_builder:
    runs-on: ubuntu-latest

    env:
      PIXELDRAIN_API_KEY:            ${{ secrets.PIXELDRAIN_API_KEY }}
      TELEGRAM_BOT_TOKEN:            ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_STATUS_CHAT_ID:       ${{ secrets.TELEGRAM_STATUS_CHAT_ID }}
      TELEGRAM_PUBLISH_CHANNEL_ID:   ${{ secrets.TELEGRAM_PUBLISH_CHANNEL_ID }}

    steps:
      # ── Determine mode ─────────────────────────────────────────────────────
      - name: Resolve mode
        id: mode
        run: |
          # Scheduled runs always use scan_only
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=scan_only" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

          MAX="${{ inputs.max_builds }}"
          [ -z "$MAX" ] && MAX=1
          echo "max_builds=$MAX" >> "$GITHUB_OUTPUT"

      # ── Disk space (only for build modes) ─────────────────────────────────
      - name: Maximize build space
        if: ${{ steps.mode.outputs.mode != 'scan_only' }}
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Clean runner (build modes only)
        if: ${{ steps.mode.outputs.mode != 'scan_only' }}
        run: |
          docker rmi $(docker images -q) || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php || true
          sudo apt -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell mysql* php* || true
          sudo apt -y autoremove --purge || true
          sudo apt clean || true

      - name: Set timezone
        run: sudo timedatectl set-timezone Africa/Cairo

      - name: Install OpenJDK (build modes only)
        if: ${{ steps.mode.outputs.mode != 'scan_only' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip curl wget 2>/dev/null || true
          if [ "${{ steps.mode.outputs.mode }}" != "scan_only" ]; then
            sudo bash setup.sh
            sudo apt-get install -y unrar p7zip-full 2>/dev/null || true
          fi

      - name: Set permissions
        if: ${{ steps.mode.outputs.mode != 'scan_only' }}
        run: sudo chmod 777 -R *

      - name: Create output directories
        run: |
          mkdir -p bin/output/queue bin/output/state bin/output/reports bin/output/logs
          # Initialise queue/state files if absent
          [ -f bin/output/queue/auto_build_queue.json ] || echo '[]' > bin/output/queue/auto_build_queue.json
          [ -f bin/output/state/built_releases.json ]  || echo '{"built":[],"records":[]}' > bin/output/state/built_releases.json

      # ── Restore persisted queue / state from cache ─────────────────────────
      # v2-cn-global-only prefix ensures old pre-suffix-fix caches are never restored
      - name: Restore queue cache
        id: queue_cache
        uses: actions/cache@v4
        with:
          path: |
            bin/output/queue/auto_build_queue.json
            bin/output/state/built_releases.json
          key: deadzone-auto-queue-v3-bin-output-${{ github.run_id }}
          restore-keys: |
            deadzone-auto-queue-v3-bin-output-

      # ── Reset queue when explicitly requested ──────────────────────────────
      - name: Reset queue (reset_queue=true)
        if: ${{ inputs.reset_queue == true }}
        run: |
          echo '[]' > bin/output/queue/auto_build_queue.json
          echo "[QUEUE_RESET] Queue cleared — reset_queue=true"

      # ══════════════════════════════════════════════════════════════════════
      #  SCAN
      # ══════════════════════════════════════════════════════════════════════
      - name: Scan TECH_MUKUL
        if: ${{ steps.mode.outputs.mode == 'scan_only' || steps.mode.outputs.mode == 'scan_and_build' }}
        run: |
          PAGES="${{ inputs.scan_pages }}"
          [ -z "$PAGES" ] && PAGES=5
          python3 bin/scripts/scan_tech_mukul.py --scan-pages "$PAGES"

      # ══════════════════════════════════════════════════════════════════════
      #  PRUNE  — always run, removes stale/invalid items from the queue
      # ══════════════════════════════════════════════════════════════════════
      - name: Prune stale queue items
        run: python3 bin/scripts/prune_queue.py

      # ══════════════════════════════════════════════════════════════════════
      #  BUILD + UPLOAD + PUBLISH  (sequential multi-build loop)
      # ══════════════════════════════════════════════════════════════════════
      - name: Build ROM loop
        id: build_loop
        if: ${{ steps.mode.outputs.mode == 'build_next' || steps.mode.outputs.mode == 'scan_and_build' }}
        run: |
          EXTRA_ARGS=""
          # auto_publish: true when explicitly set on workflow_dispatch, or for scheduled runs
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.auto_publish }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --auto-publish"
          fi
          if [ "${{ inputs.stop_on_first_failure }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --stop-on-first-failure"
          fi
          python3 bin/scripts/build_next_stable.py \
            --max-builds "${{ steps.mode.outputs.max_builds }}" \
            $EXTRA_ARGS

      # ══════════════════════════════════════════════════════════════════════
      #  ARTIFACTS  (reports + logs + queue/state only — no ROM ZIPs)
      # ══════════════════════════════════════════════════════════════════════
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadzone-auto-stable-reports-${{ github.run_number }}
          path: |
            bin/output/reports/**
            bin/output/logs/**
            bin/output/queue/**
            bin/output/state/**
          if-no-files-found: warn
          retention-days: 30

      # ── Cleanup build workspace ────────────────────────────────────────────
      - name: Cleanup build workspace
        if: always()
        run: |
          sudo rm -rf "${{ github.workspace }}/out"   || true
          sudo rm -rf "${{ github.workspace }}/build" || true
          rm -f /tmp/tg_watch_stop /tmp/mezo_build.log /tmp/mezo_pack.log /tmp/mezo_package.log || true
